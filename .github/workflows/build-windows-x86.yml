name: Build mtkclient (Windows x86 / 32-bit)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up 32-bit Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x86'

      - name: Prove the interpreter is really 32-bit
        run: python -c "import struct,sys;print(sys.version);assert struct.calcsize('P')*8==32,'NOT 32-bit!'"

      - name: Install runtime deps (NO GUI)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install pyusb pycryptodome pycryptodomex colorama pyserial keystone-engine capstone unicorn mfusepy

      - name: Grab 32-bit libusb DLL for pyusb
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z" -OutFile libusb.7z
          7z x libusb.7z -olibusb

      - name: Build single-file exe (CLI only)
        shell: pwsh
        run: |
          $dll = (Get-ChildItem -Recurse libusb -Filter libusb-1.0.dll |
                  Where-Object FullName -match 'MS32' | Select-Object -First 1).FullName
          pyinstaller --noconfirm --clean --onefile `
            --name mtk `
            --collect-all mtkclient `
            --collect-all capstone `
            --collect-all keystone `
            --collect-all unicorn `
            --collect-all usb `
            --add-binary "$dll;." `
            --hidden-import usb `
            --hidden-import serial `
            --exclude-module PySide6 `
            --exclude-module shiboken6 `
            mtk.py

      - uses: actions/upload-artifact@v4
        with:
          name: mtk-windows-x86
          path: dist/mtk.exe
